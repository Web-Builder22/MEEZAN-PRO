<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        var file = (event && event.filename) || '';
        if (msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport') || file.includes('@vite/client')) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.stopPropagation) event.stopPropagation();
          if (event.preventDefault) event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var text = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (text.includes('WebSocket') || text.includes('@vite/client') || text.includes('createWebSocketModuleRunnerTransport')) {
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          if (event.stopPropagation) event.stopPropagation();
          if (event.preventDefault) event.preventDefault();
        }
      }, true);
    </script>
    <title>MeezanFlow — Balance your business. Flow with confidence.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Progressive Web App Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B192C" />
    <meta name="description" content="Modern business accounting and financial management SaaS for small businesses, shopkeepers, wholesalers, and independent business owners." />
    <meta property="og:title" content="MeezanFlow — Balance your business. Flow with confidence." />
    <meta property="og:description" content="Modern business accounting and financial management SaaS for small businesses, shopkeepers, wholesalers, and independent business owners." />
    <meta property="og:type" content="website" />
    
    <!-- iOS / Apple Web App Experience -->
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MeezanFlow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('MeezanFlow PWA SW Registered under scope:', reg.scope);
            })
            .catch((err) => {
              console.error('MeezanFlow PWA SW Registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
